# Release: build the desktop app for macOS, Linux and Windows; publish on a tag.
#
# `v0.1.0` -> a GitHub Release with the .dmg and a .zip of the .app (macOS), a
# .deb and an .AppImage (Linux) and an NSIS installer (Windows). A manual run
# without a tag builds the same artifacts and leaves them as workflow
# artifacts, so the build can be exercised without publishing anything. The
# app runs the bundled daemon with the user's own `node`, which must be on PATH.
#
# The bundle is ad-hoc signed only (no Developer ID here), so a downloaded copy
# carries the quarantine flag: right-click > Open the first time, or strip it
# with `xattr -dr com.apple.quarantine`. Adding APPLE_CERTIFICATE,
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY and the notarization
# secrets below would make the download open normally.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # The shell bundles the daemon and the Web UI as resources, so both must
      # exist before `tauri build` copies them in.
      - name: Build the daemon, CLI, TUI and Web UI
        run: pnpm build

      # Unsigned (ad-hoc) build. To sign and notarize, declare the secrets and
      # put these back on the step below: Tauri imports the certificate when the
      # variables exist, and an *empty* APPLE_CERTIFICATE makes it try (and
      # fail) to import nothing, so they must stay absent until real values are
      # configured.
      #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      #
      # `pnpm run <script> -- ...` would hand the `--` to tauri, which then
      # forwards `--bundles` to cargo. Call the CLI directly instead.
      - name: Build the app and its disk image
        run: pnpm exec tauri build --bundles app,dmg
        working-directory: apps/desktop

      - name: Archive the .app
        run: |
          cd apps/desktop/src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent "SSH Tunnel.app" \
            "$GITHUB_WORKSPACE/SSH-Tunnel-macos-arm64.zip"

      - name: Collect the disk image
        run: |
          cp apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg \
            "$GITHUB_WORKSPACE/SSH-Tunnel-macos-arm64.dmg"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SSH-Tunnel-macos-arm64.dmg
            SSH-Tunnel-macos-arm64.zip
          generate_release_notes: true

      - name: Keep the artifacts of a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: SSH-Tunnel-macos-arm64
          path: |
            SSH-Tunnel-macos-arm64.dmg
            SSH-Tunnel-macos-arm64.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the WebView and GTK development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build the daemon, CLI, TUI and Web UI
        run: pnpm build

      - name: Build the app and its packages
        run: pnpm exec tauri build --bundles deb,appimage
        working-directory: apps/desktop

      - name: Collect the packages
        run: |
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb \
            "$GITHUB_WORKSPACE/SSH-Tunnel-linux-x64.deb"
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage \
            "$GITHUB_WORKSPACE/SSH-Tunnel-linux-x64.AppImage"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SSH-Tunnel-linux-x64.deb
            SSH-Tunnel-linux-x64.AppImage

      - name: Keep the artifacts of a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: SSH-Tunnel-linux-x64
          path: |
            SSH-Tunnel-linux-x64.deb
            SSH-Tunnel-linux-x64.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build the daemon, CLI, TUI and Web UI
        run: pnpm build

      - name: Build the app and its installer
        run: pnpm exec tauri build --bundles nsis
        working-directory: apps/desktop

      - name: Collect the installer
        shell: bash
        run: |
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*.exe \
            "$GITHUB_WORKSPACE/SSH-Tunnel-windows-x64-setup.exe"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SSH-Tunnel-windows-x64-setup.exe

      - name: Keep the artifacts of a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: SSH-Tunnel-windows-x64
          path: SSH-Tunnel-windows-x64-setup.exe
