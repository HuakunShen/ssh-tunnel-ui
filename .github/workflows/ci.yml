# CI: typecheck, boundary check and the portable test suite.
#
# The TUI render snapshots are excluded here: OpenTUI's renderer needs a native
# FFI that is not available under this vitest setup (it fails the same way
# locally under node and bun). Everything else in `pnpm test` runs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck every package
        run: pnpm check

      - name: Package boundaries
        run: pnpm check:boundaries

      # The build stages the Web UI into the DSH plugin package, which one of
      # the contract tests serves; run it before the suite, not after.
      - name: Build the daemon, CLI, TUI and Web UI
        run: pnpm build

      - name: Tests
        run: pnpm test:ci

  # The release builds the shell on three operating systems; if one of them
  # stops compiling, a tag is the worst place to find out. `cargo check` is the
  # cheap half of `tauri build` — it never links a bundle, but it compiles every
  # `#[cfg]` branch this host can reach.
  desktop:
    name: shell — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux WebView prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # `generate_context!` only requires the `frontendDist` path to exist, so a
      # stub stands in for the real Web UI here: the release job builds it.
      - name: Stub the frontend dist
        shell: bash
        run: |
          mkdir -p apps/web/dist
          echo '<!doctype html>' > apps/web/dist/index.html

      - name: Check the shell
        working-directory: apps/desktop/src-tauri
        run: cargo check --workspace

      - name: Shell unit tests
        if: runner.os == 'macOS'
        working-directory: apps/desktop/src-tauri
        run: cargo test

